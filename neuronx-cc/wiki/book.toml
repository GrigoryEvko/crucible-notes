[book]
title = "neuronx-cc Internals — AWS Neuron Compiler Reference"
authors = ["crucible-notes contributors"]
description = "Reverse-engineering reference for the AWS Neuron compiler stack: hlo2penguin, walrus (libwalrus.so), BIR (libBIR.so), NKI Python frontend, and the Tonga/Sunda/Cayman/CoreV4 backend code generators."
language = "en"
src = "src"

[output.html]
default-theme = "navy"
additional-js = ["ai-disclaimer.js"]
additional-css = ["custom.css"]
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/GrigoryEvko/crucible-notes"
edit-url-template = "https://github.com/GrigoryEvko/crucible-notes/edit/main/neuronx-cc/wiki/{path}"

[output.html.search]
enable = true
limit-results = 30

[output.html.fold]
enable = true
level = 2
