name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv mdbook /usr/local/bin/

      - name: Build wikis
        run: |
          (cd ptxas/wiki && mdbook build)
          (cd cicc/wiki && mdbook build)
          (cd "cudafe++/wiki" && mdbook build)
          (cd nvlink/wiki && mdbook build)

      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp -r docs/ptxas _site/ptxas
          cp -r docs/cicc _site/cicc
          cp -r "docs/cudafe++" "_site/cudafe++"
          cp -r docs/nvlink _site/nvlink

      - name: Inject canonical links and generate sitemap
        run: python3 .github/workflows/seo_postprocess.py _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
