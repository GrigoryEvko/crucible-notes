[book]
title = "libtpu Internals — Reverse-Engineering Reference"
authors = ["crucible-notes contributors"]
description = "Reverse-engineering reference for Google's libtpu.so PJRT plugin (CUDA-equivalent for TPUs). Reconstructed from the stripped 745 MB ELF shipped in the libtpu-0.0.40-cp314 wheel."
language = "en"
src = "src"

[build]
build-dir = "../../docs/libtpu"
create-missing = true

[output.html]
default-theme = "light"
additional-js = ["ai-disclaimer.js"]
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/GrigoryEvko/crucible-notes"
edit-url-template = "https://github.com/GrigoryEvko/crucible-notes/edit/main/libtpu/wiki/{path}"
additional-css = ["custom.css"]
no-section-label = false

[output.html.search]
enable = true
limit-results = 30
use-hierarchical-heading = true

[output.html.fold]
enable = true
level = 2
