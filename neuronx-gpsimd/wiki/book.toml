[book]
title = "neuronx-gpsimd Internals — The Vision-Q7 GPSIMD Reimplementation Reference"
authors = ["crucible-notes contributors"]
description = "Reimplementation-grade reverse-engineering reference for AWS Neuron's GPSIMD engine — the Cadence Tensilica Vision-Q7 NX 'Cairo' DSP (config ncore2gp, 512-bit FLIX/VLIW vector ISA) embedded in each NeuronCore. Covers the Q7 core & ISA, per-instruction encoding & formal semantics, microarchitecture & timing, device firmware & the kernel/opcode catalog, per-generation firmware images (Sunda v2 / Cayman v3 / Mariana v4 / Mariana+ v4+ / Maverick v5), the custom-op ABI, the libnrt host runtime, DMA/descriptors, collectives & NCFW, the NEFF container, the compiler seam, the control plane (CSR/address/interrupt/security), the libcas/libfiss ISS oracle, and bit-exact differential validation. Reconstructed entirely from static analysis of shipped binaries."
language = "en"
src = "src"

[build]
build-dir = "../../docs/neuronx-gpsimd"

[output.html]
default-theme = "light"
additional-js = ["ai-disclaimer.js"]
additional-css = ["custom.css"]
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/GrigoryEvko/crucible-notes"
edit-url-template = "https://github.com/GrigoryEvko/crucible-notes/edit/main/neuronx-gpsimd/wiki/{path}"

[output.html.search]
enable = true
limit-results = 30
use-hierarchical-heading = true

[output.html.fold]
enable = true
level = 1
