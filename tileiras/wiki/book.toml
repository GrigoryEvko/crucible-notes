[book]
title = "Tileiras Internals"
authors = ["crucible-notes"]
description = "Reverse engineering documentation for NVIDIA's tileiras MLIR-based optimizing assembler (CUDA 13.1)"
language = "en"
src = "src"

[build]
build-dir = "../../docs/tileiras"
create-missing = true

[output.html]
default-theme = "light"
additional-js = ["ai-disclaimer.js"]
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/GrigoryEvko/crucible-notes"
additional-css = ["custom.css"]
no-section-label = false

[output.html.search]
enable = true
limit-results = 30
use-hierarchical-heading = true
