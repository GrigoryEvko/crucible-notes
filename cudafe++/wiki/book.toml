[book]
title = "cudafe++ Reverse Engineering Reference"
authors = ["nvopen-tools"]
description = "Reverse engineering documentation for NVIDIA's CUDA frontend compiler (cudafe++ v13.0, EDG 6.6)"
language = "en"
src = "src"

[build]
build-dir = "../../docs/cudafe++"
create-missing = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/GrigoryEvko/nvopen-tools"
additional-css = ["custom.css"]
no-section-label = false

[output.html.search]
enable = true
limit-results = 30
use-hierarchical-heading = true
